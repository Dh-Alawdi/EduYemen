<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#072644"/>
      <stop offset="50%" stop-color="#0b3d6b"/>
      <stop offset="100%" stop-color="#1565a8"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#06192a"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- خلفية السماء الأكاديمية -->
  <rect width="800" height="480" fill="url(#skyGrad)"/>

  <!-- نجوم وشبكة هندسية خفيفة في الخلفية -->
  <g opacity="0.15">
    <circle cx="120" cy="80" r="1.5" fill="#ffffff"/>
    <circle cx="280" cy="60" r="2" fill="#ffffff"/>
    <circle cx="450" cy="90" r="1.5" fill="#ffffff"/>
    <circle cx="680" cy="70" r="2" fill="#ffffff"/>
    <circle cx="730" cy="120" r="1.5" fill="#ffffff"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- خلفية المباني الخلفية (ظلال الحرم الجامعي) -->
  <g fill="#0b3256" opacity="0.6">
    <rect x="60" y="220" width="100" height="140" rx="4"/>
    <rect x="640" y="210" width="110" height="150" rx="4"/>
    <polygon points="110,180 60,220 160,220"/>
    <polygon points="695,170 640,210 750,210"/>
  </g>

  <!-- الصرح الأكاديمي الرئيسي (Main Academic Building) -->
  <g filter="url(#subtleShadow)">
    <!-- الجناح الأيمن -->
    <rect x="150" y="230" width="150" height="130" fill="url(#buildingGrad)" rx="2"/>
    <!-- الجناح الأيسر -->
    <rect x="500" y="230" width="150" height="130" fill="url(#buildingGrad)" rx="2"/>

    <!-- نوافذ الأجنحة -->
    <g fill="#0b3d6b" opacity="0.75">
      <rect x="170" y="250" width="22" height="30" rx="3"/>
      <rect x="210" y="250" width="22" height="30" rx="3"/>
      <rect x="250" y="250" width="22" height="30" rx="3"/>
      <rect x="170" y="300" width="22" height="30" rx="3"/>
      <rect x="210" y="300" width="22" height="30" rx="3"/>
      <rect x="250" y="300" width="22" height="30" rx="3"/>

      <rect x="528" y="250" width="22" height="30" rx="3"/>
      <rect x="568" y="250" width="22" height="30" rx="3"/>
      <rect x="608" y="250" width="22" height="30" rx="3"/>
      <rect x="528" y="300" width="22" height="30" rx="3"/>
      <rect x="568" y="300" width="22" height="30" rx="3"/>
      <rect x="608" y="300" width="22" height="30" rx="3"/>
    </g>

    <!-- المبنى المركزي البارز -->
    <rect x="280" y="180" width="240" height="180" fill="#ffffff" rx="4"/>

    <!-- القبة الأكاديمية والتاج الذهبي -->
    <path d="M 340 180 Q 400 110 460 180 Z" fill="url(#goldGrad)"/>
    <circle cx="400" cy="110" r="7" fill="#fef08a"/>
    <line x1="400" y1="103" x2="400" y2="88" stroke="#fef08a" stroke-width="3"/>

    <!-- الواجهة الرخامية والأعمدة الكلاسيكية -->
    <polygon points="400,145 280,180 520,180" fill="#e2e8f0"/>
    <rect x="290" y="177" width="220" height="6" fill="url(#goldGrad)"/>

    <!-- أعمدة الصرح (Columns) -->
    <g fill="#cbd5e1">
      <rect x="310" y="183" width="16" height="150" rx="2"/>
      <rect x="345" y="183" width="16" height="150" rx="2"/>
      <rect x="380" y="183" width="16" height="150" rx="2"/>
      <rect x="404" y="183" width="16" height="150" rx="2"/>
      <rect x="439" y="183" width="16" height="150" rx="2"/>
      <rect x="474" y="183" width="16" height="150" rx="2"/>
    </g>

    <!-- البوابة الرئيسية الفاخرة -->
    <path d="M 375 360 L 375 275 Q 400 250 425 275 L 425 360 Z" fill="#072644"/>
    <circle cx="400" cy="275" r="8" fill="url(#goldGrad)"/>

    <!-- درجات المدخل -->
    <rect x="260" y="358" width="280" height="8" fill="#94a3b8" rx="2"/>
    <rect x="240" y="366" width="320" height="8" fill="#64748b" rx="2"/>
  </g>

  <!-- الأشجار والمساحات الخضراء المحيطة -->
  <g>
    <!-- شجرة يمين -->
    <ellipse cx="140" cy="355" rx="35" ry="50" fill="#15803d" opacity="0.9"/>
    <ellipse cx="155" cy="345" rx="25" ry="40" fill="#16a34a"/>
    <!-- شجرة يسار -->
    <ellipse cx="660" cy="355" rx="35" ry="50" fill="#15803d" opacity="0.9"/>
    <ellipse cx="645" cy="345" rx="25" ry="40" fill="#16a34a"/>
  </g>

  <!-- الأرضية وساحة الحرم -->
  <rect x="0" y="374" width="800" height="106" fill="url(#groundGrad)"/>
  <line x1="0" y1="374" x2="800" y2="374" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- النص التوضيحي الأنيق -->
  <g text-anchor="middle" font-family="'Cairo', sans-serif">
    <text x="400" y="420" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">الحرم الجامعي الأكاديمي الرئيسي</text>
    <text x="400" y="445" font-size="13" font-weight="600" fill="#94a3b8">بوابة التعليم الجامعي المعتمد • EduYemen Portal</text>
  </g>
</svg>
